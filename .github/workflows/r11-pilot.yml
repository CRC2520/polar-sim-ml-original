name: POLAR R11 development pilot

on:
  pull_request:
    paths:
      - "r11_causal/**"
      - ".github/workflows/r11-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-repro.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-repro.txt
      - run: python -m unittest r11_causal.test_r11 -v
      - name: Run R11 development pilots only
        run: python -m r11_causal.pilot --output r11_results/pilot
      - run: cat r11_results/pilot/PILOT_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: polar-r11-development-pilot
          path: |
            r11_causal/
            r11_results/pilot/
          retention-days: 30
