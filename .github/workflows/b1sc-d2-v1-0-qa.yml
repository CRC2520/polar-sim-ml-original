name: B1-SC-D2 v1.0 implementation QA and preflight only
'on':
  push:
    branches:
      - research/b1sc-d2-v1.0-training-scaffold-20260915
    paths:
      - .github/workflows/b1sc-d2-v1-0-qa.yml
      - experiments/b1sc_d2_v1_0/implementation.py
      - experiments/b1sc_d2_v1_0/tests.py
      - experiments/b1sc_d2_v1_0/preflight.py

permissions:
  contents: read

concurrency:
  group: b1sc-d2-v1-0-implementation-qa
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  qa_preflight:
    name: Qualify D2 implementation without scientific execution
    if: ${{ github.repository == 'CRC2520/polar-sim-ml-original' && github.ref == 'refs/heads/research/b1sc-d2-v1.0-training-scaffold-20260915' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: b1s/execution/requirements.txt

      - name: Prove D2 scientific execution is not authorized
        run: |
          set -euo pipefail
          test ! -e experiments/b1sc_d2_v1_0/START_REQUEST.json
          test ! -e experiments/b1sc_d2_v1_0/runner.py
          test ! -e experiments/b1sc_d2_v1_0/run/IMPLEMENTATION_FREEZE.json
          echo "B1-SC-D2 QA/PREFLIGHT ONLY — NO SCIENTIFIC TRAINING"

      - name: Install preserved runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
          python -m pip check

      - name: Run D2 contract and runtime QA
        run: |
          set -euo pipefail
          rm -rf /tmp/b1sc-d2-qa
          python -m experiments.b1sc_d2_v1_0.tests --out /tmp/b1sc-d2-qa

      - name: Run guarded D2 implementation preflight
        run: |
          set -euo pipefail
          rm -rf /tmp/b1sc-d2-preflight
          python -m experiments.b1sc_d2_v1_0.preflight \
            --qa /tmp/b1sc-d2-qa \
            --out /tmp/b1sc-d2-preflight

      - name: Retain D2 QA and preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1sc-d2-v1-0-implementation-qa-preflight
          path: |
            /tmp/b1sc-d2-qa
            /tmp/b1sc-d2-preflight
          retention-days: 90
          if-no-files-found: error
