name: R37 external POPGym development

on:
  pull_request:
    paths:
      - "experiments/r37_popgym_external_20260922/**"
      - ".github/workflows/r37_popgym_dev.yml"

permissions:
  contents: read

jobs:
  r37-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen external benchmark
        run: |
          python -m pip install numpy==2.3.5 scipy==1.17.0 popgym==1.0.7
          python - <<'PY'
          import importlib.metadata as m
          assert m.version("popgym")=="1.0.7"
          print("popgym",m.version("popgym"))
          PY
      - name: Record source identity
        run: |
          python - <<'PY'
          import hashlib,pathlib,json
          root=pathlib.Path("experiments/r37_popgym_external_20260922")
          c=json.loads((root/"R37_FIXED_CRITERIA.json").read_text())
          assert c["status"]=="FROZEN_BEFORE_DEVELOPMENT"
          assert c["confirmatory_seeds"]==list(range(2037001,2037013))
          h=hashlib.sha256((root/"r37_popgym_external.py").read_bytes()).hexdigest()
          (root/"R37_DEV_SOURCE_SHA256.txt").write_text(h+"\n")
          print("R37 source sha256",h)
          PY
      - name: Run development seeds only
        run: |
          python experiments/r37_popgym_external_20260922/r37_popgym_external.py \
            --criteria experiments/r37_popgym_external_20260922/R37_FIXED_CRITERIA.json \
            --mode dev \
            --output experiments/r37_popgym_external_20260922/R37_DEV_RESULTS.json
      - name: Guard confirmatory seeds unopened
        run: |
          python - <<'PY'
          import json
          d=json.load(open("experiments/r37_popgym_external_20260922/R37_DEV_RESULTS.json"))
          assert [r["seed"] for r in d["records"]]==list(range(2036001,2036005))
          print(json.dumps(d["adjudication"],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r37-popgym-development
          path: |
            experiments/r37_popgym_external_20260922/R37_DEV_RESULTS.json
            experiments/r37_popgym_external_20260922/R37_FIXED_CRITERIA.json
            experiments/r37_popgym_external_20260922/R37_DEV_SOURCE_SHA256.txt
