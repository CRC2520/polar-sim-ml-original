name: Integrated polar P0-P2 engineering tests
on:
  push:
    branches: [research/integrated-polar-p0-p2]
    paths: ['integrated_polar/**','gap_resolution/**','tests/test_integrated_polar.py','.github/workflows/integrated-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install numpy==2.3.5 scipy==1.17.0 matplotlib==3.10.8 pandas==2.2.3
          pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Run old and new regression tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee /tmp/integrated-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-engineering-tests
          path: /tmp/integrated-tests.txt
          retention-days: 14
