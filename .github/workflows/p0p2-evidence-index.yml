name: P0-P2 additional evidence audit and index
on:
  push:
    branches: [research/integrated-polar-p0-p2]
    paths: ['.github/workflows/p0p2-evidence-index.yml','scripts/audit_p0p2_additional.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit-and-package:
    if: github.ref == 'refs/heads/research/integrated-polar-p0-p2'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5
      - name: Post-run audit; preserve all originally recorded outcomes
        run: python scripts/audit_p0p2_additional.py
      - name: Publish audit and new research index
        run: |
          python - <<'PY'
          from pathlib import Path
          text='\n\n## Integrated P0-P2 gap realization\n\nThe original layered architecture now has a bounded integrated implementation in `integrated_polar/`, with separate internal state/intention/action, learned directed effects, priority-sensitive planning, content broadcast, gated memory and institutional constraints. See [the Spanish gap-closure report](docs/P0P2_CIERRE_GAPS.md). The 128 tests passed. The registered P1 decision is `engineering_verified_with_partial_empirical_support`: priority use and return-cue memory pass the practical criteria; coupled planning and the longer horizon do not. The P2 probability forecast is calibrated on the tested domain, but its experimental review policy harms tracking and is not enabled by default. General ethics, intrinsic motivation, philosophical semantics and consciousness are not established. Prior Studies 1–3 remain unchanged.\n\nThe new experiment entry point is `python -m gap_resolution.run regenerate`; final seeds are already observed and their replays are not new confirmation. `docs/P0P2_ADDITIONAL_AUDIT.json` records post-run diagnostic/capability verification, separate from the original final records.\n'
          for name in ('README.md','SPECIFICATION.md'):
              p=Path(name)
              if '## Integrated P0-P2 gap realization' not in p.read_text():p.write_text(p.read_text()+text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md SPECIFICATION.md docs/P0P2_ADDITIONAL_AUDIT.json
          git commit -m 'audit: index bounded gap closure and verify all diagnostic/capability evidence [skip ci]'
          git push origin HEAD:research/integrated-polar-p0-p2
      - name: Package usable source plus reports; raw large traces remain in repository
        run: |
          mkdir -p /tmp/p0p2-final-delivery
          cp docs/P0P2_CIERRE_GAPS.md docs/P0P2_ADDITIONAL_AUDIT.json docs/P0P2_PROTOCOL.md docs/P0P2_FREEZE.json docs/P0P2_TEST_REPORT.json /tmp/p0p2-final-delivery/
          cp results_p0p2/development/P0_DIAGNOSIS.json results_p0p2/final/P1_RESULTS.json results_p0p2/final/P2_RESULTS.json results_p0p2/final/REGENERATION.json results_p0p2/final/STARTED.json /tmp/p0p2-final-delivery/
          git rev-parse HEAD > /tmp/p0p2-final-delivery/CODE_COMMIT.txt
          python - <<'PY'
          from pathlib import Path
          import zipfile
          with zipfile.ZipFile('/tmp/p0p2-final-delivery/Polar_Dynamics_codigo_integrado.zip','w',zipfile.ZIP_DEFLATED) as z:
              files=[Path(n) for n in ['README.md','SPECIFICATION.md','requirements-repro.txt','network_tension.py','engine_v1_locked.py','engine_v2_corrected.py']]
              for folder in ['integrated_polar','gap_resolution','polar','study2','study3','tests','scripts','docs']:
                  files.extend(p for p in Path(folder).rglob('*') if p.is_file())
              for p in files:
                  if '__pycache__' not in str(p) and ':' not in str(p) and p.suffix not in ('.pyc','.ttf','.otf','.woff','.woff2'):z.write(p,str(p))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: Polar_Dynamics_P0P1P2_codigo_resultados
          path: /tmp/p0p2-final-delivery
          retention-days: 14
          if-no-files-found: error
