name: R35 access necessity development

on:
  push:
    branches: [research/r35-access-necessity-20260922]
    paths:
      - experiments/r35_access_necessity_20260922/r35_access_necessity.py
      - experiments/r35_access_necessity_20260922/PREREG_R35.md
      - .github/workflows/r35_access_necessity_dev.yml
  pull_request:
    branches: [main]
    paths:
      - experiments/r35_access_necessity_20260922/**
      - .github/workflows/r35_access_necessity_dev.yml

permissions:
  contents: read

jobs:
  r35-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.14.0+cpu numpy==2.3.5
      - name: Syntax check
        run: python -m py_compile experiments/r35_access_necessity_20260922/r35_access_necessity.py
      - name: Record source identity
        run: git hash-object experiments/r35_access_necessity_20260922/r35_access_necessity.py > experiments/r35_access_necessity_20260922/R35_DEV_SOURCE_GIT_BLOB.txt
      - name: Run development panel only
        run: |
          python experiments/r35_access_necessity_20260922/r35_access_necessity.py \
            --mode dev \
            --seeds 1906001:1906004 \
            --output experiments/r35_access_necessity_20260922/R35_DEV_RESULTS.json
      - name: Guard development split
        run: |
          python - <<'PY'
          import json
          p="experiments/r35_access_necessity_20260922/R35_DEV_RESULTS.json"
          d=json.load(open(p))
          assert d["mode"]=="dev"
          assert d["seeds"]==list(range(1906001,1906005))
          assert d["development_architectures"]==["CURRENT_MLP","RNN","GRU"]
          assert d["strict_heldout_architectures"]==["WINDOW_MLP","LSTM"]
          assert d["development_families"]==["ring"]
          print(json.dumps(d["medians"],indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r35-access-necessity-development
          path: |
            experiments/r35_access_necessity_20260922/R35_DEV_RESULTS.json
            experiments/r35_access_necessity_20260922/R35_DEV_SOURCE_GIT_BLOB.txt
