name: POLAR R11b feasibility-audited pilot

on:
  pull_request:
    paths:
      - "r11_causal_invariance/r11b.py"
      - "r11_causal_invariance/pilot_b.py"
      - "r11_causal_invariance/core.py"
      - "r11_causal_invariance/environments.py"
      - "r11_causal_invariance/PREREG_R11B.md"
      - ".github/workflows/r11b-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-b:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5
      - name: Run R11 smoke tests
        run: python -m unittest r11_causal_invariance.test_r11 -v
      - name: Execute feasibility audit and new pilot seeds
        run: python -m r11_causal_invariance.pilot_b --output r11_results/pilot_b
      - run: cat r11_results/pilot_b/PILOT_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: polar-r11b-pilot
          path: |
            r11_causal_invariance/PREREG_R11B.md
            r11_results/pilot_b/
          retention-days: 90
