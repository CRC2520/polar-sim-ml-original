name: B1-SC-D2-R1 scientific runner QA only
'on':
  push:
    branches:
      - research/b1sc-d2-r1-v1.0-runner-readiness-20260915
    paths:
      - experiments/b1sc_d2_r1_v1_0/scientific_runner.py
      - experiments/b1sc_d2_r1_v1_0/runner.py
      - experiments/b1sc_d2_r1_v1_0/runner_tests.py
      - experiments/b1sc_d2_r1_v1_0/runner_preflight.py
      - .github/workflows/b1sc-d2-r1-v1-0-scientific.yml
      - .github/workflows/b1sc-d2-r1-runner-qa.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: b1sc-d2-r1-runner-qa
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  rules:
    name: Static runner contract
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: b1s/execution/requirements.txt
      - name: Install preserved runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
      - name: Run static qualification rules
        run: python -m experiments.b1sc_d2_r1_v1_0.runner_tests rules
  runtime:
    name: Frozen-init guarded microfit
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: b1s/execution/requirements.txt
      - name: Prove scientific authorization is absent
        run: test ! -e experiments/b1sc_d2_r1_v1_0/START_REQUEST.json
      - name: Download canonical frozen initialization bytes
        uses: actions/download-artifact@v4
        with:
          name: b1sc-d2-r1-init-candidates
          path: /tmp/d2r1-init
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: CRC2520/polar-sim-ml-original
          run-id: 35007729637
      - name: Install preserved runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
          python -m pip check
      - name: Run bounded QA microfits and ordering tests
        run: |
          rm -rf /tmp/d2r1-runner-runtime
          python -m experiments.b1sc_d2_r1_v1_0.runner_tests runtime \
            --init-dir /tmp/d2r1-init \
            --out /tmp/d2r1-runner-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: d2r1-runner-runtime-qa
          path: /tmp/d2r1-runner-runtime
          retention-days: 90
          if-no-files-found: error
  preflight:
    name: Runner preflight qualification
    needs: [rules, runtime]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Generate runner freeze and preflight status
        run: |
          rm -rf /tmp/d2r1-runner-preflight
          python -m experiments.b1sc_d2_r1_v1_0.runner_preflight \
            --out /tmp/d2r1-runner-preflight \
            --source-commit '${{ github.sha }}' \
            --qa-run-id '${{ github.run_id }}'
      - uses: actions/upload-artifact@v4
        with:
          name: d2r1-runner-preflight
          path: /tmp/d2r1-runner-preflight
          retention-days: 90
          if-no-files-found: error
  final:
    name: Publish qualification bundle
    needs: [runtime, preflight]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: d2r1-runner-*
          path: /tmp/d2r1-runner-qualification
      - uses: actions/upload-artifact@v4
        with:
          name: d2r1-runner-qualification
          path: /tmp/d2r1-runner-qualification
          retention-days: 90
          if-no-files-found: error
