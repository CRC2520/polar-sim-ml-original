name: POLAR P3 development pilot

on:
  pull_request:
    paths:
      - "p3_remaining/**"
      - ".github/workflows/p3-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5
      - name: Smoke tests
        run: python -m unittest p3_remaining.test_p3 -v
      - name: Pilot
        run: python -m p3_remaining.pilot --output p3_results/pilot
      - name: Report
        run: cat p3_results/pilot/PILOT_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: polar-p3-development-pilot
          path: |
            p3_remaining/
            p3_results/pilot/
          retention-days: 30
