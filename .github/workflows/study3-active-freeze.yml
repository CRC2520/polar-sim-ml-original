name: Study 3 separate active panel registration
on:
  push:
    branches: [research/study3-network-evaluation]
    paths: ['scripts/run_study3_active.py', 'docs/STUDY3_ACTIVE_PANEL_PROTOCOL.md', '.github/workflows/study3-active-freeze.yml']
permissions:
  contents: write
jobs:
  freeze-active-only:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.3.5
      - name: Select active configurations from existing development scores only
        run: python scripts/run_study3_active.py prepare
      - name: Publish active panel freeze before either final study
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/STUDY3_ACTIVE_FREEZE.json
          git commit -m 'research: register active-K panel separately before final seeds [skip ci]'
          git push origin HEAD:research/study3-network-evaluation
