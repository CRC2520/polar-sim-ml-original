name: B1-SC-D2-R1 initial-state candidate generation only
'on':
  push:
    branches:
      - research/b1sc-d2-r1-v1.0-byte-frozen-init-20260915
    paths:
      - experiments/b1sc_d2_r1_v1_0/**
      - .github/workflows/b1sc-d2-r1-init-freeze.yml
permissions:
  contents: read
concurrency:
  group: b1sc-d2-r1-init-freeze
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  generate:
    name: Generate eight candidate initial-state byte snapshots
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Prove no scientific authorization
        run: |
          set -euo pipefail
          test ! -e experiments/b1sc_d2_r1_v1_0/START_REQUEST.json
          echo 'D2-R1 INIT FREEZE GENERATION ONLY — NO SCIENTIFIC TRAINING'
      - name: Install preserved runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
          python -m pip check
      - name: Generate candidate byte snapshots
        run: |
          set -euo pipefail
          rm -rf /tmp/b1sc-d2-r1-init-candidates
          python -m experiments.b1sc_d2_r1_v1_0.freeze_initial_states --out /tmp/b1sc-d2-r1-init-candidates
      - uses: actions/upload-artifact@v4
        with:
          name: b1sc-d2-r1-init-candidates
          path: /tmp/b1sc-d2-r1-init-candidates
          retention-days: 90
          if-no-files-found: error
