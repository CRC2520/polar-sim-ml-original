name: R10 five-experiment campaign

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pilot-and-qa:
    if: github.head_ref == 'research/r10-five-experiments-20260920'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-repro.txt
      - name: Install frozen CPU environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-repro.txt
      - name: Run repository regression tests
        run: python -m unittest discover -s tests -t . -v
      - name: Run R10 contract tests
        run: python -m unittest r10_completion.test_r10 -v
      - name: Run excluded R10 pilot
        run: python -m r10_completion.runner --phase pilot --output r10_results/pilot
      - name: Print compact pilot diagnostics
        run: |
          python - <<'PY'
          import json
          p=json.load(open('r10_results/pilot/R10_RESULTS.json'))
          print('AGG', json.dumps(p['aggregate'],sort_keys=True))
          for r in p['per_seed']:
              out={
                'seed':r['seed'],
                'E1':{'pass':r['E1']['pass_strong'],'d':r['E1']['selected_dimension'],'m':r['E1']['confirmatory']},
                'E2':{'pass':r['E2']['pass_strong'],'exact':r['E2']['exact_isomorphism'],'struct':r['E2']['matched_structural']},
                'E3':{'pass':r['E3']['pass_strong'],'m':r['E3']['confirmatory']},
                'E4':{'pass':r['E4']['pass_strong'],'heldout':r['E4']['heldout']},
                'E5':{'pass':r['E5']['pass_strong'],'intact':r['E5']['intact'],'signatures':r['E5']['lesion_signatures'],'n':r['E5']['signature_count']}
              }
              print('SEED',json.dumps(out,sort_keys=True))
          PY
      - name: Generate candidate scientific freeze manifest
        run: |
          python -m r10_completion.freeze --output r10_results/pilot/FREEZE_CANDIDATE.json
          cat r10_results/pilot/FREEZE_CANDIDATE.json
      - uses: actions/upload-artifact@v4
        with:
          name: r10-pilot-results
          path: r10_results/pilot/
          if-no-files-found: error
