name: R43 external recurrent baseline qualification

on:
  push:
    branches: [research/r43-external-recurrent-baseline-20260923]
    paths:
      - experiments/r43_external_recurrent_baseline_20260923/PREREG_R43.md
      - experiments/r43_external_recurrent_baseline_20260923/r43_baseline.py
      - .github/workflows/r43_baseline.yml

permissions:
  contents: read

env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

jobs:
  train:
    strategy:
      fail-fast: false
      matrix:
        seed: [2146001,2146002,2146003]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed external stack
        run: |
          python -m pip install torch==2.7.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 gymnasium==1.2.1 stable-baselines3==2.7.1 sb3-contrib==2.7.1 popgym==1.0.7
      - name: Syntax and train
        run: |
          python -m py_compile experiments/r43_external_recurrent_baseline_20260923/r43_baseline.py
          python experiments/r43_external_recurrent_baseline_20260923/r43_baseline.py --stage train --seed ${{ matrix.seed }} --out r43_results
      - name: Provenance
        if: always()
        run: |
          mkdir -p r43_results
          git rev-parse HEAD > r43_results/commit_${{ matrix.seed }}.txt
          python -m pip freeze > r43_results/packages_${{ matrix.seed }}.txt
          sha256sum experiments/r43_external_recurrent_baseline_20260923/* > r43_results/source_${{ matrix.seed }}.sha256 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r43-model-${{ matrix.seed }}
          path: r43_results/

  evaluate:
    needs: train
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fixed external stack
        run: |
          python -m pip install torch==2.7.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.3.5 gymnasium==1.2.1 stable-baselines3==2.7.1 sb3-contrib==2.7.1 popgym==1.0.7
      - uses: actions/download-artifact@v4
        with:
          pattern: r43-model-*
          path: r43_results
          merge-multiple: true
      - name: Evaluate development and held-out only if authorized
        run: python experiments/r43_external_recurrent_baseline_20260923/r43_baseline.py --stage evaluate --out r43_results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r43-evidence
          path: r43_results/
