name: B1-SC-D3 runner + microfit + execution preflight QA
'on':
  push:
    branches:
      - research/b1sc-d3-v1.0-runner-preflight-20260916
    paths:
      - experiments/b1sc_d3_v1_0/execution_preflight.py
      - experiments/b1sc_d3_v1_0/microfit_qa.py
      - experiments/b1sc_d3_v1_0/runner.py
      - experiments/b1sc_d3_v1_0/INIT_FREEZE.json
      - experiments/b1sc_d3_v1_0/frozen_init/**
      - tests/test_b1sc_d3_runner_preflight.py
      - .github/workflows/b1sc-d3-runner-preflight-qa.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: b1sc-d3-runner-preflight-qa
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  gate:
    name: Eight-byte snapshot gate + bounded microfit
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Install frozen D3 QA runtime
        run: |
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu 'numpy==1.26.4' 'torch==2.2.2+cpu' 'pytest==8.3.5'
          python -m pip check
      - name: Prove scientific authorization remains absent during qualification
        run: |
          test ! -e experiments/b1sc_d3_v1_0/START_REQUEST.json
          test ! -e experiments/b1sc_d3_v1_0/START_REQUEST_FREEZE.json
      - name: Compile D3 runner surfaces
        run: |
          python -m py_compile \
            experiments/b1sc_d3_v1_0/execution_preflight.py \
            experiments/b1sc_d3_v1_0/microfit_qa.py \
            experiments/b1sc_d3_v1_0/runner.py
      - name: Validate all eight immutable snapshots without optimizer creation
        run: python -m experiments.b1sc_d3_v1_0.execution_preflight > /tmp/d3-execution-preflight.json
      - name: Run corruption gate and bounded deterministic microfit QA
        run: python -m experiments.b1sc_d3_v1_0.microfit_qa --block 0 --condition LOCAL-S6 > /tmp/d3-microfit-qa.json
      - name: Run focused invariant tests
        run: python -m pytest -q tests/test_b1sc_d3_runner_preflight.py
      - name: Assert QA receipts are explicitly non-scientific
        run: |
          python - <<'PY'
          import json
          p=json.load(open('/tmp/d3-execution-preflight.json'))
          m=json.load(open('/tmp/d3-microfit-qa.json'))
          assert p['blocks_validated']==8
          assert p['optimizer_created'] is False
          assert p['training_step_performed'] is False
          assert p['scientific_training_performed'] is False
          assert m['corruption_gate']['optimizer_factory_calls']==0
          assert m['corruption_gate']['training_steps']==0
          assert m['microfit']['snapshot_validated_before_optimizer'] is True
          assert m['microfit']['first_step_after_preflight'] is True
          assert m['microfit']['scientific_training_performed'] is False
          print('D3_RUNNER_GATE_QA_PASS')
          PY
      - name: Emit post-QA authorization candidate metadata
        env:
          QA_RUN_ID: ${{ github.run_id }}
          QA_RUN_ATTEMPT: ${{ github.run_attempt }}
          QA_HEAD_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path('.')
          exp=root/'experiments/b1sc_d3_v1_0'
          def h(path):return hashlib.sha256(path.read_bytes()).hexdigest()
          critical=[
            'experiments/b1sc_d3_v1_0/runner.py',
            'experiments/b1sc_d3_v1_0/execution_preflight.py',
            'experiments/b1sc_d3_v1_0/microfit_qa.py',
            'experiments/b1sc_d3_v1_0/init_format.py',
            'experiments/b1sc_d3_v1_0/implementation.py',
            'b1s/execution/core.py',
            'b1s/execution/instrument.py',
            'b1s/execution/requirements.txt',
          ]
          freeze=json.loads((exp/'INIT_FREEZE.json').read_text())
          registry=json.loads((exp/'FIT_REGISTRY.json').read_text())
          candidate={
            'schema':'B1-SC-D3-START-AUTHORITY-CANDIDATE-1.0.0-20260916',
            'status':'CANDIDATE_EMITTED_AFTER_ALL_QA_ASSERTIONS',
            'qualified_runner_commit':os.environ['QA_HEAD_COMMIT'],
            'qa':{
              'workflow':'B1-SC-D3 runner + microfit + execution preflight QA',
              'run_id':int(os.environ['QA_RUN_ID']),
              'run_attempt':int(os.environ['QA_RUN_ATTEMPT']),
              'head_commit':os.environ['QA_HEAD_COMMIT'],
              'expected_conclusion':'success',
            },
            'design_sha256':h(exp/'DESIGN_FREEZE.json'),
            'init_freeze_sha256':h(exp/'INIT_FREEZE.json'),
            'fit_registry_sha256':h(exp/'FIT_REGISTRY.json'),
            'protocol_sha256':h(exp/'PROTOCOL_ES.md'),
            'critical_source_sha256':{p:h(root/p) for p in critical},
            'snapshot_sha256s':{str(r['block']):r['sha256'] for r in freeze['blocks']},
            'fit_ids':[r['id'] for r in registry],
            'fit_count':len(registry),
            'native_steps_per_fit':1048576,
            'scientific_training_performed':False,
            'scientific_evaluation_performed':False,
            'B1E_executed':False,
          }
          pathlib.Path('/tmp/d3-start-authority-candidate.json').write_text(json.dumps(candidate,indent=2,sort_keys=True)+'\n')
          print(json.dumps({'status':candidate['status'],'qualified_runner_commit':candidate['qualified_runner_commit'],'fit_count':candidate['fit_count']},sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: d3-runner-preflight-qa
          path: |
            /tmp/d3-execution-preflight.json
            /tmp/d3-microfit-qa.json
            /tmp/d3-start-authority-candidate.json
          retention-days: 90
          if-no-files-found: error
