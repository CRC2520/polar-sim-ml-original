name: POLAR P2-Critical development pilot

on:
  pull_request:
    paths:
      - "p2_critical/**"
      - ".github/workflows/p2-critical-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.3.5
      - name: Smoke tests
        run: python -m unittest p2_critical.test_p2_critical -v
      - name: Pilot
        run: python -m p2_critical.pilot --output p2_critical_results/pilot
      - name: Report
        run: cat p2_critical_results/pilot/PILOT_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: polar-p2-critical-pilot
          path: |
            p2_critical/
            p2_critical_results/pilot/
          retention-days: 30
