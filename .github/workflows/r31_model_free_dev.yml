name: R31 model-free RL development


on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r31-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Record source identity
        run: |
          sha256sum experiments/r31_model_free_rl_20260921/r31_model_free_rl.py > experiments/r31_model_free_rl_20260921/R31_DEV_SOURCE_SHA256.txt
      - name: Run development seeds only
        run: |
          python experiments/r31_model_free_rl_20260921/r31_model_free_rl.py \
            --seeds 1546001:1546004 \
            --output experiments/r31_model_free_rl_20260921/R31_DEV_RESULTS.json
      - name: Guard against confirmatory leakage
        run: |
          python - <<'PY'
          import json
          p="experiments/r31_model_free_rl_20260921/R31_DEV_RESULTS.json"
          d=json.load(open(p))
          assert d["seeds"]==list(range(1546001,1546005))
          assert all(s<1547001 for s in d["seeds"])
          print(json.dumps(d["medians"],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r31-model-free-development
          path: |
            experiments/r31_model_free_rl_20260921/R31_DEV_RESULTS.json
            experiments/r31_model_free_rl_20260921/R31_DEV_SOURCE_SHA256.txt
