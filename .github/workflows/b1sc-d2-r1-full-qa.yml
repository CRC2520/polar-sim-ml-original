name: B1-SC-D2-R1 full execution-readiness QA only
'on':
  push:
    branches:
      - research/b1sc-d2-r1-v1.0-run2-repair-20260915
    paths:
      - experiments/b1sc_d2_r1_v1_0/scientific_runner.py
      - experiments/b1sc_d2_r1_v1_0/full_execution.py
      - experiments/b1sc_d2_r1_v1_0/runner.py
      - experiments/b1sc_d2_r1_v1_0/runner_tests.py
      - experiments/b1sc_d2_r1_v1_0/full_pipeline_tests.py
      - experiments/b1sc_d2_r1_v1_0/full_preflight.py
      - experiments/b1sc_d2_r1_v1_0/initialization.py
      - experiments/b1sc_d2_r1_v1_0/frozen_init/PERSISTED_MANIFEST.json
      - experiments/b1sc_d2_r1_v1_0/frozen_init/block-*.bin
      - .github/workflows/b1sc-d2-r1-v1-0-scientific.yml
      - .github/workflows/b1sc-d2-r1-full-qa.yml
permissions:
  contents: read
  actions: read
concurrency:
  group: b1sc-d2-r1-run2-readiness-qa
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  rules:
    name: Full pipeline static contracts
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 2}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: b1s/execution/requirements.txt
      - name: Install preserved runtime
        run: |
          sudo apt-get update -qq && sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
      - name: Requalify byte-gated runner rules
        run: python -m experiments.b1sc_d2_r1_v1_0.runner_tests rules
      - name: Qualify full pipeline rules
        run: python -m experiments.b1sc_d2_r1_v1_0.full_pipeline_tests rules
  runtime:
    name: Repository-persisted microfit and synthetic gate QA
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 2}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: b1s/execution/requirements.txt
      - name: Prove scientific authorization is absent
        run: test ! -e experiments/b1sc_d2_r1_v1_0/START_REQUEST.json
      - name: Install preserved runtime
        run: |
          sudo apt-get update -qq && sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
          python -m pip check
      - name: Repository-persisted byte-gated QA microfits only
        run: |
          rm -rf /tmp/d2r1-runner-runtime
          python -m experiments.b1sc_d2_r1_v1_0.runner_tests runtime --init-dir repository-persisted --out /tmp/d2r1-runner-runtime
      - name: Synthetic full-pipeline gate tests only
        run: |
          rm -rf /tmp/d2r1-full-tests
          python -m experiments.b1sc_d2_r1_v1_0.full_pipeline_tests runtime --out /tmp/d2r1-full-tests
      - uses: actions/upload-artifact@v4
        with:
          name: d2r1-full-runtime-qa
          path: |
            /tmp/d2r1-runner-runtime
            /tmp/d2r1-full-tests
          retention-days: 90
          if-no-files-found: error
  preflight:
    name: Full pipeline preflight
    needs: [rules, runtime]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.sha }}', fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11.16'}
      - name: Generate full execution freeze and status
        run: |
          rm -rf /tmp/d2r1-full-preflight
          python -m experiments.b1sc_d2_r1_v1_0.full_preflight --out /tmp/d2r1-full-preflight --source-commit '${{ github.sha }}' --qa-run-id '${{ github.run_id }}'
      - uses: actions/upload-artifact@v4
        with:
          name: d2r1-full-preflight
          path: /tmp/d2r1-full-preflight
          retention-days: 90
          if-no-files-found: error
  final:
    name: Publish full readiness qualification bundle
    needs: [runtime, preflight]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: d2r1-full-*
          path: /tmp/d2r1-full-qualification
      - uses: actions/upload-artifact@v4
        with:
          name: d2r1-full-execution-qualification
          path: /tmp/d2r1-full-qualification
          retention-days: 90
          if-no-files-found: error
