name: B1-SC-D4 scientific runner QA only
'on':
  push:
    branches:
      - research/b1sc-d4-v1.0-runner-readiness-20260916
    paths:
      - experiments/b1sc_d4_v1_0/RUNNER_CONTRACT.json
      - experiments/b1sc_d4_v1_0/scientific_runner.py
      - experiments/b1sc_d4_v1_0/runner_tests.py
      - experiments/b1sc_d4_v1_0/runner_preflight.py
      - .github/workflows/b1sc-d4-runner-qa.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: b1sc-d4-runner-qa
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  static_contract:
    name: Static D4 runner and twelve-snapshot contract
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: b1s/execution/requirements.txt
      - name: Prove scientific authorization is absent
        run: test ! -e experiments/b1sc_d4_v1_0/START_REQUEST.json
      - name: Install preserved runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
          python -m pip check
      - name: Verify runner contract and all twelve frozen repository bytes
        run: |
          rm -rf /tmp/d4-runner-static
          python -m experiments.b1sc_d4_v1_0.runner_tests rules --out /tmp/d4-runner-static
      - uses: actions/upload-artifact@v4
        with:
          name: d4-runner-static-qa
          path: /tmp/d4-runner-static
          retention-days: 90
          if-no-files-found: error

  microfit:
    name: Three-treatment frozen-init switch-crossing microfit QA
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: b1s/execution/requirements.txt
      - name: Prove scientific authorization is absent
        run: test ! -e experiments/b1sc_d4_v1_0/START_REQUEST.json
      - name: Install preserved runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
          python -m pip check
      - name: Run bounded QA microfits across the frozen switch
        run: |
          rm -rf /tmp/d4-runner-microfit
          python -m experiments.b1sc_d4_v1_0.runner_tests runtime --out /tmp/d4-runner-microfit
      - uses: actions/upload-artifact@v4
        with:
          name: d4-runner-microfit-qa
          path: /tmp/d4-runner-microfit
          retention-days: 90
          if-no-files-found: error

  execution_preflight:
    name: D4 execution preflight qualification
    needs: [static_contract, microfit]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: '${{ github.sha }}'
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: b1s/execution/requirements.txt
      - name: Install preserved runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
          python -m pip check
      - uses: actions/download-artifact@v4
        with:
          name: d4-runner-static-qa
          path: /tmp/d4-runner-static
      - uses: actions/download-artifact@v4
        with:
          name: d4-runner-microfit-qa
          path: /tmp/d4-runner-microfit
      - name: Verify immutable D4 lineage and qualify runner without authorization
        run: |
          rm -rf /tmp/d4-runner-preflight
          python -m experiments.b1sc_d4_v1_0.runner_preflight \
            --out /tmp/d4-runner-preflight \
            --source-commit '${{ github.sha }}' \
            --qa-run-id '${{ github.run_id }}' \
            --static-evidence /tmp/d4-runner-static/STATIC_CONTRACT.json \
            --microfit-evidence /tmp/d4-runner-microfit/MICROFIT_QA.json
      - uses: actions/upload-artifact@v4
        with:
          name: d4-runner-execution-preflight
          path: /tmp/d4-runner-preflight
          retention-days: 90
          if-no-files-found: error

  qualification_bundle:
    name: Publish D4 runner qualification bundle
    needs: [execution_preflight]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: d4-runner-*
          path: /tmp/d4-runner-qualification
      - uses: actions/upload-artifact@v4
        with:
          name: d4-runner-qualification
          path: /tmp/d4-runner-qualification
          retention-days: 90
          if-no-files-found: error
