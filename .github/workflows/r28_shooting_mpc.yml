name: R28 stabilized shooting MPC

on:
  pull_request:
    paths:
      - "experiments/r28_shooting_mpc_20260921/**"
      - ".github/workflows/r28_shooting_mpc.yml"

permissions:
  contents: read

jobs:
  r28:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen numerical dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Verify fixed criteria and record source identity
        run: |
          python - <<'PY'
          import json, hashlib, pathlib
          root=pathlib.Path("experiments/r28_shooting_mpc_20260921")
          c=json.loads((root/"R28_FIXED_CRITERIA.json").read_text())
          assert c["status"]=="FROZEN_BEFORE_PR_EXECUTION"
          assert c["confirmatory_seeds"]==list(range(1517001,1517013))
          h=hashlib.sha256((root/"r28_shooting_mpc.py").read_bytes()).hexdigest()
          (root/"R28_SOURCE_SHA256.txt").write_text(h+"\n")
          print("R28 source sha256",h)
          PY
      - name: Run development and confirmatory seeds
        run: |
          python experiments/r28_shooting_mpc_20260921/r28_shooting_mpc.py \
            --criteria experiments/r28_shooting_mpc_20260921/R28_FIXED_CRITERIA.json \
            --output experiments/r28_shooting_mpc_20260921/R28_RESULTS.json
      - name: Verify confirmatory seed set and print adjudication
        run: |
          python - <<'PY'
          import json
          p="experiments/r28_shooting_mpc_20260921/R28_RESULTS.json"
          d=json.load(open(p))
          got=[r["seed"] for r in d["confirmatory"]["records"]]
          assert got==list(range(1517001,1517013)),got
          print(json.dumps(d["confirmatory"]["adjudication"],indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r28-shooting-mpc
          path: |
            experiments/r28_shooting_mpc_20260921/R28_RESULTS.json
            experiments/r28_shooting_mpc_20260921/R28_FIXED_CRITERIA.json
            experiments/r28_shooting_mpc_20260921/R28_SOURCE_SHA256.txt
