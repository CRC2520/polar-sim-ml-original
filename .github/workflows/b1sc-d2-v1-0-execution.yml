name: B1-SC-D2 v1.0 guarded scientific execution
'on':
  push:
    branches:
      - research/b1sc-d2-v1.0-execution-readiness-20260915
    paths:
      - experiments/b1sc_d2_v1_0/START_REQUEST.json
permissions:
  contents: read
concurrency:
  group: b1sc-d2-v1-0-scientific-execution
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  SDL_VIDEODRIVER: dummy
  SDL_AUDIODRIVER: dummy
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  authorize:
    name: Authorize immutable B1-SC-D2 run attempt 1
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Install authorization dependency
        run: python -m pip install numpy==1.26.4
      - name: authorize single D2 execution
        run: |
          set -euo pipefail
          rm -rf /tmp/b1sc-d2-authorize
          python -m experiments.b1sc_d2_v1_0.runner authorize --out /tmp/b1sc-d2-authorize
      - uses: actions/upload-artifact@v4
        with:
          name: b1sc-d2-authorization
          path: /tmp/b1sc-d2-authorize
          retention-days: 90
          if-no-files-found: error
  fit:
    name: Fit ${{ matrix.condition }} block ${{ matrix.block }}
    needs: authorize
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        condition: [S6-ON, S6-OFF-TRAIN]
        block: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: b1s/execution/requirements.txt
      - name: Install preserved runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
          python -m pip check
      - name: fit one paired D2 condition/block
        run: |
          set -euo pipefail
          rm -rf /tmp/b1sc-d2-fit
          python -m experiments.b1sc_d2_v1_0.runner fit \
            --condition '${{ matrix.condition }}' --block '${{ matrix.block }}' \
            --out /tmp/b1sc-d2-fit
      - name: Retain fit or failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1sc-d2-fit-${{ matrix.condition }}-b${{ matrix.block }}
          path: /tmp/b1sc-d2-fit
          retention-days: 90
          if-no-files-found: error
  training_aggregate:
    name: Aggregate D2 training-scaffold effect
    needs: [authorize, fit]
    if: ${{ always() && needs.authorize.result == 'success' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      ready: ${{ steps.status.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: b1s/execution/requirements.txt
      - name: Install preserved runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
          python -m pip check
      - name: Download all 16 retained fits
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: b1sc-d2-fit-*
          path: /tmp/b1sc-d2-fits
      - name: aggregate H_TRAIN-D2 and diagnostics
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf /tmp/b1sc-d2-training
          python -m experiments.b1sc_d2_v1_0.runner training-aggregate \
            --fits /tmp/b1sc-d2-fits \
            --out /tmp/b1sc-d2-training
      - name: Retain training aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1sc-d2-training-aggregate
          path: /tmp/b1sc-d2-training
          retention-days: 90
          if-no-files-found: error
      - name: training aggregate status
        id: status
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,pathlib
          p=pathlib.Path('/tmp/b1sc-d2-training/TRAINING_EFFECT.json')
          ok=p.is_file() and json.loads(p.read_text()).get('status')=='D2_TRAINING_EFFECT_COMPLETE'
          print('ready=' + ('true' if ok else 'false'))
          PY
      - name: Block continuation on incomplete training aggregate
        if: ${{ steps.status.outputs.ready != 'true' }}
        run: exit 1
  online:
    name: Online dependence block ${{ matrix.block }}
    needs: training_aggregate
    if: ${{ needs.training_aggregate.outputs.ready == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        block: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: b1s/execution/requirements.txt
      - name: Install preserved runtime
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
          python -m pip check
      - uses: actions/download-artifact@v4
        with:
          name: b1sc-d2-fit-S6-ON-b${{ matrix.block }}
          path: /tmp/b1sc-d2-fits/b1sc-d2-fit-S6-ON-b${{ matrix.block }}
      - name: permanent lesion and 9-40 replication
        run: |
          set -euo pipefail
          rm -rf /tmp/b1sc-d2-online
          python -m experiments.b1sc_d2_v1_0.runner online \
            --block '${{ matrix.block }}' \
            --fits /tmp/b1sc-d2-fits \
            --out /tmp/b1sc-d2-online
      - name: Retain online evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1sc-d2-online-b${{ matrix.block }}
          path: /tmp/b1sc-d2-online
          retention-days: 90
          if-no-files-found: error
  online_aggregate:
    name: Aggregate D2 online-dependence gate
    needs: [training_aggregate, online]
    if: ${{ always() && needs.training_aggregate.outputs.ready == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    outputs:
      ready: ${{ steps.status.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Install aggregate dependency
        run: python -m pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: b1sc-d2-online-*
          path: /tmp/b1sc-d2-online-root
      - name: aggregate H_ONLINE-D2
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf /tmp/b1sc-d2-online-aggregate
          python -m experiments.b1sc_d2_v1_0.runner online-aggregate \
            --online-root /tmp/b1sc-d2-online-root \
            --out /tmp/b1sc-d2-online-aggregate
      - name: Retain online aggregate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1sc-d2-online-aggregate
          path: /tmp/b1sc-d2-online-aggregate
          retention-days: 90
          if-no-files-found: error
      - name: online aggregate status
        id: status
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json,pathlib
          p=pathlib.Path('/tmp/b1sc-d2-online-aggregate/ONLINE_EFFECT.json')
          ok=p.is_file() and json.loads(p.read_text()).get('status')=='D2_ONLINE_EFFECT_COMPLETE'
          print('ready=' + ('true' if ok else 'false'))
          PY
      - name: Block continuation on incomplete online aggregate
        if: ${{ steps.status.outputs.ready != 'true' }}
        run: exit 1
  final:
    name: Final D2 mechanistic adjudication artifact
    needs: [training_aggregate, online_aggregate]
    if: ${{ always() && needs.training_aggregate.outputs.ready == 'true' && needs.online_aggregate.outputs.ready == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Install aggregate dependency
        run: python -m pip install numpy==1.26.4
      - uses: actions/download-artifact@v4
        with:
          name: b1sc-d2-training-aggregate
          path: /tmp/b1sc-d2-training
      - uses: actions/download-artifact@v4
        with:
          name: b1sc-d2-online-aggregate
          path: /tmp/b1sc-d2-online-aggregate
      - name: final frozen adjudication
        run: |
          set -euo pipefail
          rm -rf /tmp/b1sc-d2-final
          python -m experiments.b1sc_d2_v1_0.runner final \
            --training /tmp/b1sc-d2-training/TRAINING_EFFECT.json \
            --online /tmp/b1sc-d2-online-aggregate/ONLINE_EFFECT.json \
            --out /tmp/b1sc-d2-final
      - name: Retain final D2 review artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b1sc-d2-final-review
          path: /tmp/b1sc-d2-final
          retention-days: 90
          if-no-files-found: error
