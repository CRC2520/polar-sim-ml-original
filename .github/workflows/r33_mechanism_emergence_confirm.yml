name: R33 mechanism emergence confirmatory

on:
  push:
    branches: [research/r33-mechanism-emergence-20260921]
    paths:
      - .github/workflows/r33_mechanism_emergence_confirm.yml

permissions:
  contents: read

jobs:
  r33-confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.14.0+cpu numpy==2.3.5
      - name: Verify frozen source adjudicator and confirmatory split
        run: |
          python - <<'PY'
          import json,pathlib,subprocess
          root=pathlib.Path("experiments/r33_mechanism_emergence_20260921")
          f=json.loads((root/"R33_CONFIRM_FREEZE.json").read_text())
          assert f["status"]=="FROZEN_BEFORE_CONFIRMATORY_SEEDS"
          assert f["confirmatory_seeds"]==list(range(1707001,1707013))
          assert f["confirmatory_eval_families"]==["random_dag","skew"]
          assert f["strict_heldout_architectures"]==["WINDOW_MLP","LSTM"]
          src=subprocess.check_output(["git","hash-object",str(root/"r33_mechanism_emergence.py")],text=True).strip()
          adj=subprocess.check_output(["git","hash-object",str(root/"adjudicate_r33.py")],text=True).strip()
          assert src==f["source_git_blob_sha"],(src,f["source_git_blob_sha"])
          assert adj==f["adjudicator_git_blob_sha"],(adj,f["adjudicator_git_blob_sha"])
          print("R33 freeze PASS",src,adj)
          PY
      - name: Execute untouched confirmatory seeds and held-out architectures
        run: |
          python experiments/r33_mechanism_emergence_20260921/r33_mechanism_emergence.py \
            --mode confirm \
            --seeds 1707001:1707012 \
            --output experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_RESULTS.json
      - name: Adjudicate frozen criteria
        run: |
          python experiments/r33_mechanism_emergence_20260921/adjudicate_r33.py \
            --results experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_RESULTS.json \
            --freeze experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_FREEZE.json \
            --source experiments/r33_mechanism_emergence_20260921/r33_mechanism_emergence.py \
            --output experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_ADJUDICATION.json
      - name: Record provenance
        run: |
          git rev-parse HEAD > experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_COMMIT.txt
          sha256sum experiments/r33_mechanism_emergence_20260921/r33_mechanism_emergence.py > experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_SOURCE_SHA256.txt
          sha256sum experiments/r33_mechanism_emergence_20260921/adjudicate_r33.py > experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_ADJUDICATOR_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r33-mechanism-emergence-confirmatory
          path: |
            experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_RESULTS.json
            experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_ADJUDICATION.json
            experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_FREEZE.json
            experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_COMMIT.txt
            experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_SOURCE_SHA256.txt
            experiments/r33_mechanism_emergence_20260921/R33_CONFIRM_ADJUDICATOR_SHA256.txt
