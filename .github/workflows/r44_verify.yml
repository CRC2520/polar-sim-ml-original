name: R44 evidence integrity

on:
  push:
    branches: [research/r44-published-external-reference-20260923]
    paths:
      - experiments/r44_published_external_reference_20260923/**
      - .github/workflows/r44_verify.yml
  pull_request:
    branches: [main]
    paths:
      - experiments/r44_published_external_reference_20260923/**
      - .github/workflows/r44_verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify frozen R44 evidence
        run: python experiments/r44_published_external_reference_20260923/verify_r44.py
