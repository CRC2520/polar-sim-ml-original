name: R42 independent generator development

on:
  push:
    branches: [research/r42-independent-generator-implementation-20260923]
    paths:
      - experiments/r42_independent_generator_20260923/PREREG_R42.md
      - experiments/r42_independent_generator_20260923/r42_independent.py
      - .github/workflows/r42_dev.yml

permissions:
  contents: read

jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install numpy==2.3.5
      - name: Syntax and source identity
        run: |
          python -m py_compile experiments/r42_independent_generator_20260923/r42_independent.py
          git hash-object experiments/r42_independent_generator_20260923/r42_independent.py > experiments/r42_independent_generator_20260923/R42_DEV_SOURCE_BLOB.txt
      - name: Run development only
        run: |
          python experiments/r42_independent_generator_20260923/r42_independent.py \
            --mode dev \
            --out experiments/r42_independent_generator_20260923/R42_DEV_RESULTS.json
      - name: Guard development split
        run: |
          python - <<'PY'
          import json
          p="experiments/r42_independent_generator_20260923/R42_DEV_RESULTS.json"
          d=json.load(open(p))
          assert d["mode"]=="dev"
          assert d["development_seeds"]==list(range(2136001,2136005))
          assert d["confirmatory_seeds"]==list(range(2137001,2137017))
          assert all(x["seed"]<2137000 for x in d["records"])
          print(json.dumps(d["summary"],indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r42-development
          path: |
            experiments/r42_independent_generator_20260923/R42_DEV_RESULTS.json
            experiments/r42_independent_generator_20260923/R42_DEV_SOURCE_BLOB.txt
