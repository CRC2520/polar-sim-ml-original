name: R48 neural relation discovery from reward

on:
  push:
    branches: [research/r48-neural-relation-learning-20260924]
    paths:
      - experiments/r48_neural_relation_learning_20260924/PREREG_R48.md
      - experiments/r48_neural_relation_learning_20260924/r48_neural_relation.py
      - experiments/r48_neural_relation_learning_20260924/verify_r48.py
      - .github/workflows/r48_neural_relation.yml

permissions:
  contents: read

env:
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install frozen external stack
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "numpy==1.23.5" "gym==0.24.0" mazelib
          python -m pip install "torch==2.2.2" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps "git+https://github.com/proroklab/popgym.git@e397e5eac9965f9963d18c9f455cd1983bca14fb"
      - name: Verify runner and external API
        run: |
          python -m py_compile experiments/r48_neural_relation_learning_20260924/r48_neural_relation.py
          python -m py_compile experiments/r48_neural_relation_learning_20260924/verify_r48.py
          python - <<'PY'
          import popgym
          e=popgym.CountRecallMedium(); assert e.observation_space.nvec.tolist()==[4,4]; assert e.action_space.n==26; assert e.max_episode_length==103; e.close()
          h=popgym.CountRecallHard(); assert h.observation_space.nvec.tolist()==[13,13]; assert h.action_space.n==16; assert h.max_episode_length==207; h.close()
          print('R48 POPGym CountRecall contracts PASS')
          PY
      - name: Run non-scientific isomorphism smoke
        run: |
          mkdir -p r48_smoke
          python experiments/r48_neural_relation_learning_20260924/r48_neural_relation.py smoke --output r48_smoke/R48_SMOKE.json
          python - <<'PY'
          import json
          d=json.load(open('r48_smoke/R48_SMOKE.json')); assert d['pass']; print(d)
          PY
      - name: Record engineering provenance
        run: |
          git rev-parse HEAD > r48_smoke/EXECUTION_COMMIT.txt
          sha256sum experiments/r48_neural_relation_learning_20260924/PREREG_R48.md > r48_smoke/PROTOCOL_SHA256.txt
          sha256sum experiments/r48_neural_relation_learning_20260924/r48_neural_relation.py > r48_smoke/RUNNER_SHA256.txt
          python -m pip freeze > r48_smoke/PIP_FREEZE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r48-engineering
          path: r48_smoke/
          retention-days: 30

  development:
    needs: engineering
    strategy:
      fail-fast: false
      matrix:
        train_seed: [2196001, 2196002, 2196003]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install frozen external stack
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "numpy==1.23.5" "gym==0.24.0" mazelib
          python -m pip install "torch==2.2.2" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps "git+https://github.com/proroklab/popgym.git@e397e5eac9965f9963d18c9f455cd1983bca14fb"
      - name: Train reward-only LSTM Medium checkpoint
        run: |
          mkdir -p r48_dev/${{ matrix.train_seed }}
          python experiments/r48_neural_relation_learning_20260924/r48_neural_relation.py train --arch LSTM --level medium --train-seed ${{ matrix.train_seed }} --episodes 12000 --checkpoint r48_dev/${{ matrix.train_seed }}/checkpoint.pt
      - name: Evaluate frozen Medium checkpoint
        run: |
          python experiments/r48_neural_relation_learning_20260924/r48_neural_relation.py eval --checkpoint r48_dev/${{ matrix.train_seed }}/checkpoint.pt --level medium --phase development --output r48_dev/${{ matrix.train_seed }}/result.json
      - name: Record provenance
        if: always()
        run: |
          git rev-parse HEAD > r48_dev/${{ matrix.train_seed }}/EXECUTION_COMMIT.txt
          sha256sum experiments/r48_neural_relation_learning_20260924/PREREG_R48.md > r48_dev/${{ matrix.train_seed }}/PROTOCOL_SHA256.txt
          sha256sum experiments/r48_neural_relation_learning_20260924/r48_neural_relation.py > r48_dev/${{ matrix.train_seed }}/RUNNER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r48-dev-${{ matrix.train_seed }}
          path: r48_dev/${{ matrix.train_seed }}/
          retention-days: 30

  development_gate:
    needs: development
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      authorize_confirm: ${{ steps.gate.outputs.authorize_confirm }}
      resolution: ${{ steps.gate.outputs.resolution }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r48-dev-*
          path: r48_dev_all
      - name: Aggregate frozen development gate
        id: gate
        run: |
          mkdir -p r48_dev_gate
          mapfile -t files < <(find r48_dev_all -name result.json | sort)
          test "${#files[@]}" -eq 3
          python experiments/r48_neural_relation_learning_20260924/r48_neural_relation.py aggregate-dev --inputs "${files[@]}" --output r48_dev_gate/R48_DEVELOPMENT.json
          python - <<'PY'
          import json, os
          d=json.load(open('r48_dev_gate/R48_DEVELOPMENT.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorize_confirm=' + ('true' if d['authorize_confirm'] else 'false') + '\n')
              f.write('resolution=' + d['resolution'] + '\n')
          print(json.dumps(d,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r48-development-gate
          path: r48_dev_gate/
          retention-days: 30

  confirmatory:
    needs: development_gate
    if: needs.development_gate.outputs.authorize_confirm == 'true'
    strategy:
      fail-fast: false
      matrix:
        arch: [LSTM, GRU]
        train_seed: [2197001, 2197002, 2197003]
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install frozen external stack
        run: |
          python -m pip install --upgrade "pip<25"
          python -m pip install "numpy==1.23.5" "gym==0.24.0" mazelib
          python -m pip install "torch==2.2.2" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps "git+https://github.com/proroklab/popgym.git@e397e5eac9965f9963d18c9f455cd1983bca14fb"
      - name: Train reserved Hard checkpoint
        run: |
          mkdir -p r48_confirm/${{ matrix.arch }}-${{ matrix.train_seed }}
          python experiments/r48_neural_relation_learning_20260924/r48_neural_relation.py train --arch ${{ matrix.arch }} --level hard --train-seed ${{ matrix.train_seed }} --episodes 18000 --checkpoint r48_confirm/${{ matrix.arch }}-${{ matrix.train_seed }}/checkpoint.pt
      - name: Evaluate reserved Hard checkpoint
        run: |
          python experiments/r48_neural_relation_learning_20260924/r48_neural_relation.py eval --checkpoint r48_confirm/${{ matrix.arch }}-${{ matrix.train_seed }}/checkpoint.pt --level hard --phase confirmatory --output r48_confirm/${{ matrix.arch }}-${{ matrix.train_seed }}/result.json
      - name: Record provenance
        if: always()
        run: |
          git rev-parse HEAD > r48_confirm/${{ matrix.arch }}-${{ matrix.train_seed }}/EXECUTION_COMMIT.txt
          sha256sum experiments/r48_neural_relation_learning_20260924/PREREG_R48.md > r48_confirm/${{ matrix.arch }}-${{ matrix.train_seed }}/PROTOCOL_SHA256.txt
          sha256sum experiments/r48_neural_relation_learning_20260924/r48_neural_relation.py > r48_confirm/${{ matrix.arch }}-${{ matrix.train_seed }}/RUNNER_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r48-confirm-${{ matrix.arch }}-${{ matrix.train_seed }}
          path: r48_confirm/${{ matrix.arch }}-${{ matrix.train_seed }}/
          retention-days: 30

  confirmatory_gate:
    needs: [development_gate, confirmatory]
    if: always() && needs.development_gate.outputs.authorize_confirm == 'true' && needs.confirmatory.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: r48-confirm-*
          path: r48_confirm_all
      - name: Aggregate final R48 resolution
        run: |
          mkdir -p r48_final
          mapfile -t files < <(find r48_confirm_all -name result.json | sort)
          test "${#files[@]}" -eq 6
          python experiments/r48_neural_relation_learning_20260924/r48_neural_relation.py aggregate-confirm --inputs "${files[@]}" --output r48_final/R48_CONFIRMATORY.json
      - uses: actions/upload-artifact@v4
        with:
          name: r48-confirmatory-gate
          path: r48_final/
          retention-days: 30

  integrity:
    needs: [development_gate, confirmatory_gate]
    if: always() && needs.development_gate.result == 'success' && needs.confirmatory_gate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: r48-development-gate
          path: r48_audit/dev
      - uses: actions/download-artifact@v4
        with:
          name: r48-confirmatory-gate
          path: r48_audit/confirm
      - name: Verify frozen R48 adjudication
        run: |
          python experiments/r48_neural_relation_learning_20260924/verify_r48.py --development r48_audit/dev/R48_DEVELOPMENT.json --confirmatory r48_audit/confirm/R48_CONFIRMATORY.json | tee r48_audit/VERIFY_R48.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r48-integrity
          path: r48_audit/
          retention-days: 30
