name: R33 mechanism emergence development

on:
  push:
    branches: [research/r33-mechanism-emergence-20260921]
    paths:
      - experiments/r33_mechanism_emergence_20260921/r33_mechanism_emergence.py
      - experiments/r33_mechanism_emergence_20260921/PREREG_R33.md
      - .github/workflows/r33_mechanism_emergence_dev.yml
  pull_request:
    branches: [main]
    paths:
      - experiments/r33_mechanism_emergence_20260921/r33_mechanism_emergence.py
      - experiments/r33_mechanism_emergence_20260921/PREREG_R33.md
      - .github/workflows/r33_mechanism_emergence_dev.yml

permissions:
  contents: read

jobs:
  r33-dev:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen numerical stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu torch==2.14.0+cpu numpy==2.3.5
      - name: Syntax check
        run: python -m py_compile experiments/r33_mechanism_emergence_20260921/r33_mechanism_emergence.py
      - name: Record source identity
        run: git hash-object experiments/r33_mechanism_emergence_20260921/r33_mechanism_emergence.py > experiments/r33_mechanism_emergence_20260921/R33_DEV_SOURCE_GIT_BLOB.txt
      - name: Run development panel only
        run: |
          python experiments/r33_mechanism_emergence_20260921/r33_mechanism_emergence.py \
            --mode dev \
            --seeds 1706001:1706004 \
            --output experiments/r33_mechanism_emergence_20260921/R33_DEV_RESULTS.json
      - name: Guard split
        run: |
          python - <<'PY'
          import json
          p="experiments/r33_mechanism_emergence_20260921/R33_DEV_RESULTS.json"
          d=json.load(open(p))
          assert d["mode"]=="dev"
          assert d["seeds"]==list(range(1706001,1706005))
          assert d["development_architectures"]==["CURRENT_MLP","RNN","GRU"]
          assert d["development_eval_families"]==["ring"]
          assert d["strict_heldout_architectures"]==["WINDOW_MLP","LSTM"]
          print(json.dumps(d["medians"],indent=2,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r33-mechanism-emergence-development
          path: |
            experiments/r33_mechanism_emergence_20260921/R33_DEV_RESULTS.json
            experiments/r33_mechanism_emergence_20260921/R33_DEV_SOURCE_GIT_BLOB.txt
