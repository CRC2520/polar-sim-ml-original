name: POLAR R10 E5b validity-controlled corrective

on:
  pull_request:
    paths:
      - "r10_followup/**"
      - ".github/workflows/r10-e5b.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e5b:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-repro.txt
      - run: |
          python -m pip install --upgrade pip
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements-repro.txt
      - name: Execute E5b new-seed corrective replication
        run: python -m r10_followup.e5b --output r10_results/e5b
      - run: cat r10_results/e5b/REPORT_E5B.md
      - uses: actions/upload-artifact@v4
        with:
          name: polar-r10-e5b-validity-replication
          path: |
            r10_followup/PREREG_E5B.md
            r10_followup/e5b.py
            r10_results/e5b/
          retention-days: 90
