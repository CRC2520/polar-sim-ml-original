name: R55 bounded long-horizon autonomy

on:
  push:
    branches: [research/r54-audit-r55-long-horizon-autonomy-20260926]
    paths:
      - experiments/r55_long_horizon_autonomy_20260926/PREREG_R55.md
      - experiments/r55_long_horizon_autonomy_20260926/r55_long_horizon_autonomy.py
      - experiments/r55_long_horizon_autonomy_20260926/verify_r55.py
      - .github/workflows/r55_long_horizon_autonomy.yml

permissions:
  contents: read

jobs:
  engineering:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install "numpy==2.1.1"
      - name: Verify syntax
        run: |
          python -m py_compile experiments/r55_long_horizon_autonomy_20260926/r55_long_horizon_autonomy.py
          python -m py_compile experiments/r55_long_horizon_autonomy_20260926/verify_r55.py
      - name: Run non-scientific smoke
        run: |
          mkdir -p r55_smoke
          python experiments/r55_long_horizon_autonomy_20260926/r55_long_horizon_autonomy.py --mode smoke --output r55_smoke/R55_SMOKE.json
          python - <<'PY'
          import json, math
          d=json.load(open('r55_smoke/R55_SMOKE.json'))['record']
          assert d['conditions']['FULL_AUTONOMY']['steps_completed'] > 0
          assert d['sham_gap'] <= 1e-12
          for k in ['full_safety_fraction','goal_effect','model_effect','self_selection_effect']:
              assert math.isfinite(d[k])
          print(json.dumps(d,indent=2,sort_keys=True))
          PY
      - name: Record provenance
        run: |
          git rev-parse HEAD > r55_smoke/EXECUTION_COMMIT.txt
          sha256sum experiments/r55_long_horizon_autonomy_20260926/PREREG_R55.md > r55_smoke/PROTOCOL_SHA256.txt
          sha256sum experiments/r55_long_horizon_autonomy_20260926/r55_long_horizon_autonomy.py > r55_smoke/RUNNER_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r55-engineering
          path: r55_smoke/
          retention-days: 30

  development:
    needs: engineering
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      authorize_confirm: ${{ steps.gate.outputs.authorize_confirm }}
      resolution: ${{ steps.gate.outputs.resolution }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install "numpy==2.1.1"
      - name: Run frozen development panel
        run: |
          mkdir -p r55_dev
          python experiments/r55_long_horizon_autonomy_20260926/r55_long_horizon_autonomy.py --mode development --output r55_dev/R55_DEVELOPMENT.json
      - name: Verify and expose gate
        id: gate
        run: |
          python experiments/r55_long_horizon_autonomy_20260926/verify_r55.py --development r55_dev/R55_DEVELOPMENT.json | tee r55_dev/VERIFY_R55_DEV.txt
          python - <<'PY'
          import json, os
          d=json.load(open('r55_dev/R55_DEVELOPMENT.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('authorize_confirm=' + ('true' if d['authorize_confirm'] else 'false') + '\n')
              f.write('resolution=' + d['resolution'] + '\n')
          PY
      - name: Record provenance
        run: |
          git rev-parse HEAD > r55_dev/EXECUTION_COMMIT.txt
          sha256sum experiments/r55_long_horizon_autonomy_20260926/PREREG_R55.md > r55_dev/PROTOCOL_SHA256.txt
          sha256sum experiments/r55_long_horizon_autonomy_20260926/r55_long_horizon_autonomy.py > r55_dev/RUNNER_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r55-development
          path: r55_dev/
          retention-days: 30

  confirmatory:
    needs: development
    if: needs.development.outputs.authorize_confirm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime
        run: python -m pip install "numpy==2.1.1"
      - name: Run reserved confirmatory panel
        run: |
          mkdir -p r55_confirm
          python experiments/r55_long_horizon_autonomy_20260926/r55_long_horizon_autonomy.py --mode confirmatory --output r55_confirm/R55_CONFIRMATORY.json
      - name: Record provenance
        run: |
          git rev-parse HEAD > r55_confirm/EXECUTION_COMMIT.txt
          sha256sum experiments/r55_long_horizon_autonomy_20260926/PREREG_R55.md > r55_confirm/PROTOCOL_SHA256.txt
          sha256sum experiments/r55_long_horizon_autonomy_20260926/r55_long_horizon_autonomy.py > r55_confirm/RUNNER_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r55-confirmatory
          path: r55_confirm/
          retention-days: 30

  integrity:
    needs: [development, confirmatory]
    if: always() && needs.development.result == 'success' && needs.confirmatory.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install verifier runtime
        run: python -m pip install "numpy==2.1.1"
      - uses: actions/download-artifact@v4
        with:
          name: r55-development
          path: r55_audit/dev
      - uses: actions/download-artifact@v4
        with:
          name: r55-confirmatory
          path: r55_audit/confirm
      - name: Verify final adjudication
        run: |
          python experiments/r55_long_horizon_autonomy_20260926/verify_r55.py --development r55_audit/dev/R55_DEVELOPMENT.json --confirmatory r55_audit/confirm/R55_CONFIRMATORY.json | tee r55_audit/VERIFY_R55.txt
      - uses: actions/upload-artifact@v4
        with:
          name: r55-integrity
          path: r55_audit/
          retention-days: 30
