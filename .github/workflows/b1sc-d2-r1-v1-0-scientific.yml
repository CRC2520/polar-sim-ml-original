name: B1-SC-D2-R1 guarded scientific fits
'on':
  push:
    branches:
      - research/b1sc-d2-r1-v1.0-runner-readiness-20260915
    paths:
      - experiments/b1sc_d2_r1_v1_0/START_REQUEST.json
permissions:
  contents: read
  actions: read
concurrency:
  group: b1sc-d2-r1-scientific
  cancel-in-progress: false
defaults:
  run:
    shell: bash
env:
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  authorize:
    name: Authorize immutable D2-R1 scientific run
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
      - name: Guard frozen runner authorization
        run: |
          python - <<'PY'
          from experiments.b1sc_d2_r1_v1_0.scientific_runner import scientific_guard
          scientific_guard()
          PY
  fit:
    name: Fit ${{ matrix.condition }} block ${{ matrix.block }}
    needs: authorize
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        condition: [S6-ON, S6-OFF-TRAIN]
        block: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.16'
          cache: pip
          cache-dependency-path: b1s/execution/requirements.txt
      - name: Download canonical frozen initialization bytes
        uses: actions/download-artifact@v4
        with:
          name: b1sc-d2-r1-init-candidates
          path: /tmp/d2r1-init
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: CRC2520/polar-sim-ml-original
          run-id: 35007729637
      - name: Install preserved runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install -r b1s/execution/requirements.txt
          python -m pip check
      - name: Run one guarded D2-R1 fit
        run: |
          rm -rf /tmp/d2r1-fit
          python -m experiments.b1sc_d2_r1_v1_0.runner fit \
            --condition '${{ matrix.condition }}' \
            --block '${{ matrix.block }}' \
            --init-dir /tmp/d2r1-init \
            --out /tmp/d2r1-fit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d2r1-fit-${{ matrix.condition }}-b${{ matrix.block }}
          path: /tmp/d2r1-fit
          retention-days: 90
          if-no-files-found: error
