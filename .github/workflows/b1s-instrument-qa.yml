name: B1-S instrument causal QA
on:
  push:
    branches: [research/b1s-full-development-20260913]
    paths: ['.github/workflows/b1s-instrument-qa.yml']
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned runtime
        run: |
          sudo apt-get update -qq && sudo apt-get install -y swig
          python -m pip install 'pip==24.0' 'setuptools==69.5.1' 'wheel==0.43.0'
          python -m pip install 'torch==2.2.2' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==1.26.4' 'gymnasium==0.29.1' 'pettingzoo==1.24.3' 'box2d-py==2.3.5' 'pygame==2.5.2' 'stable-baselines3==2.3.2'
      - name: Run native and causal tests
        run: |
          python -m compileall -q b1s/execution
          python -c 'from pathlib import Path; from b1s.execution.instrument import qa; qa(Path("qa_output"))' 2>&1 | tee qa_output.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: b1s-instrument-qa
          path: |
            qa_output/
            qa_output.log
          retention-days: 30
          if-no-files-found: warn
